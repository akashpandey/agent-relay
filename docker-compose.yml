x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  subagent-dashboard:
    container_name: local-subagents-dashboard
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: local-subagents-dashboard:latest
    logging: *default-logging
    pid: "host"
    environment:
      - PORT=4242
      - HOST=0.0.0.0
      - LOGS_DIR=/app/logs
      - PROC_DIR=/host_proc
      - OPENCODE_DB=/opencode_data/opencode.db
    volumes:
      - /home/akey/local-subagents/logs:/app/logs:ro
      - /proc:/host_proc:ro
      - /home/akey/.local/share/opencode:/opencode_data:ro
    ports:
      - "4242:4242"
    restart: unless-stopped
