x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  subagent-dashboard:
    container_name: local-subagents-dashboard
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: local-subagents-dashboard:latest
    logging: *default-logging
    pid: "host"
    mem_limit: 256m
    pids_limit: 128
    cpus: 0.5
    environment:
      - PORT=4242
      - HOST=0.0.0.0
      - LOGS_DIR=/app/logs
      - PROC_DIR=/host_proc
      - OPENCODE_DB=/opencode_data/opencode.db
      - GEMINI_BRAIN=/gemini_brain
      - CLAUDE_DATA=/claude_data
      - CODEX_DATA=/codex_data
      - SUBAGENT_DATA_DIR=/app/data
    volumes:
      - /home/akey/Code/local-subagents/data:/app/data
      - /home/akey/Code/local-subagents/logs:/app/logs:ro
      - /proc:/host_proc:ro
      - /home/akey/.local/share/opencode:/opencode_data:ro
      - /home/akey/.gemini/antigravity-cli/brain:/gemini_brain:ro
      - /home/akey/.claude:/claude_data:ro
      - /home/akey/.codex:/codex_data:ro
    ports:
      - "4242:4242"
    restart: unless-stopped
