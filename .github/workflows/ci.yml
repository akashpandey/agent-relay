name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Lint & Mock Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Shell syntax check (sh -n)
        run: |
          sh -n antigravity-agent claude-agent codex-agent opencode-agent opencode-agent-fallback agent agent-wait agent-doctor install-skill

      - name: Node.js syntax check
        run: |
          node --check scripts/mcp-server.mjs scripts/agent-cli.mjs scripts/relay-handoff.mjs scripts/workspace-canonical.mjs scripts/agent-result.js scripts/subagent-tracker.js scripts/install-tui.mjs scripts/resolve-models.mjs

      - name: MCP server smoke test
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | timeout 5 node scripts/mcp-server.mjs 2>/dev/null | head -1 | node -e 'const d=JSON.parse(require("fs").readFileSync("/dev/stdin","utf8")); if(d.result?.serverInfo?.name!=="agent-relay") process.exit(1);'

      - name: Run Node.js Test Suite
        run: |
          npm run sync:skills
          if test -n "$(find tests -name '*.mjs' -print -quit)"; then
            node --test tests/*.mjs
          else
            echo "No Node.js tests found"
          fi

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          ignore_paths: dashboard data logs .playwright-cli
        continue-on-error: true

      - name: Run Mock CLI Test Suite
        run: |
          chmod +x tests/test-wrappers.sh
          ./tests/test-wrappers.sh
