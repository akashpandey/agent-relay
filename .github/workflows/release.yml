name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish npm package and GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag v$tag_version does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Run test suite
        run: |
          npm test
          npm run test:wrappers

      - name: Run package install test (requires Docker)
        run: npm run test:package

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Build release artifact
        run: |
          mkdir -p /tmp/release-artifact
          npm pack --pack-destination /tmp/release-artifact
          (cd /tmp/release-artifact && sha256sum *.tgz > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "agent-relay $GITHUB_REF_NAME" \
            --generate-notes \
            /tmp/release-artifact/*.tgz \
            /tmp/release-artifact/SHA256SUMS
